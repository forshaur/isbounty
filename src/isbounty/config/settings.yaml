# Tunable thresholds for the pipeline.

fetch:
  timeout_seconds: 15
  user_agent: "Mozilla/5.0 (compatible; BBScanner/1.0)"
  use_browser_rendering: false

context_window:
  sentences_before: 1
  sentences_after: 1

first_party:
  high_threshold: 18          # lowered from 25 – more realistic for real policy pages
  max_pronoun_points: 15
  max_domain_mention_points: 15
  reporting_channel_points: 20
  safe_harbor_points: 10
  max_third_person_penalty: 25
  third_person_penalty_per_hit: 3
  pronoun_point_cap_hits: 15
  domain_mention_point_multiplier: 2

confidence:
  not_program_default: 0.9
  structural_reject_default: 0.9
  base: 0.55
  monetary_hit_bonus: 0.12
  max_monetary_bonus: 0.25
  first_party_score_divisor: 80
  max_first_party_bonus: 0.25
  conflict_penalty: 0.18
  floor: 0.35
  ceiling: 0.97