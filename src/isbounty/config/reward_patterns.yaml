triggers:
  - bounty
  - bounties
  - reward
  - rewards
  - compensation
  - payment
  - payout
  - paypal
  - monetary
  - cash
  - "cash prize"
  - "hall of fame"
  - recognition
  - swag
  - "gift card"
  - loot
  - acknowledge
  - acknowledgment
  - "credit(?:ed)?\\b"
  - "api credits?"
  - severity
  - "bug bounty"
  - "vulnerability disclosure"

heading_keywords:
  - reward
  - bounty
  - compensation
  - payment
  - "hall of fame"
  - recognition
  - payout
  - severity
  - "bug bounty"
  - "in scope"
  - "out of scope"

# Strong monetary / structured reward language
monetary_positive:
  # Currency amounts
  - "\\$\\s?\\d"
  - "\\bUSD\\b"
  - "\\bEUR\\b"
  - "€\\s?\\d"
  - "£\\s?\\d"
  - "up to \\$\\d"
  - "from \\$\\d"
  - "\\$\\d+\\s*[-–—to]+\\s*\\$?\\d+"

  # Direct payment language
  - "we (?:will |may |can )?pay"
  - "we (?:will |may )?offer (?:a |cash |monetary )?(?:reward|bounty|payment)"
  - "bounty (?:of|amount|reward|program|payout)"
  - "monetary (?:reward|award|amount|compensation|benefit)"
  - "cash (?:reward|prize|bounty)"
  - "paypal"
  - "wire transfer"
  - "bank transfer"
  - "variable monetary amount"
  - "non-cash payment method"
  - "reward amounts?"
  - "pay(?:ing)? (?:a )?bounty"
  - "gift card"
  - "payout"
  - "api credits?"
  - "severity[- ]based (?:reward|payout|bounty)"
  - "align reward amounts with the severity"
  - "rewards? (?:are|is) at our discretion"
  - "all rewards are at our discretion"
  - "we aim to align reward"
  - "eligible for (?:a )?(?:bounty|reward|payout|monetary)"
  - "bounty reward"
  - "will (?:receive|be awarded) (?:a )?(?:bounty|reward|payment)"
  - "get rewarded"
  - "you (?:will |may )?be rewarded"
  - "reward depends on"
  - "reward levels?"
  - "your reward"
  - "the actual reward"
  - "monetary reward and severity"
  - "rewards of up to"
  - "bounties range from"
  - "up to \\$\\d{1,3}(?:,\\d{3})*"

# Scoped / limited negations (do NOT treat as global no-pay)
scoped_negation:
  - "for (?:third[- ]party|out[- ]of[- ]scope|low[- ]?severity|low[- ]impact|informational) (?:reports?|findings?|vulnerabilit(?:y|ies)|issues?)"
  - "previously (?:ran|offered|had)"
  - "no longer run a classic"
  - "used to (?:offer|run|pay)"
  - "not eligible for (?:a )?(?:monetary |cash )?(?:reward|bounty|payout)"
  - "low severity (?:findings?|issues?|reports?) (?:are|is) not eligible"
  - "does not (?:apply|extend) to third[- ]party"
  - "rewards will not be given"
  - "will not (?:be )?eligible for a reward"
  - "not be eligible for a reward"
  - "will not qualify for bounties"

# Absolute global no-pay statements
global_no_pay:
  - "we do not offer (?:any )?(?:money|cash|monetary rewards?)"
  - "we don'?t offer (?:any )?(?:money|cash|monetary)"
  - "do not (?:offer|provide|pay) (?:any )?(?:monetary|cash) (?:rewards?|bounties?|compensation)"
  - "no (?:paid|cash|monetary) (?:bug )?bounty"
  - "we do not operate a paid"
  - "does not (?:currently )?operate a (?:paid )?bug bounty"
  - "recognition only"
  - "we no longer offer any monetary"
  - "not a paid (?:bug bounty|program)"
  - "non-monetary (?:only|rewards?)"
  - "we don'?t pay"
  - "unpaid (?:bug bounty|program)"
  - "no monetary rewards?"
  - "we do not (?:offer|provide) money or swag"
  - "no cash rewards?"
  - "we do not pay researchers"

# Recognition / thanks only
recognition_only:
  - "hall of fame"
  - "public credit"
  - "public acknowledgment"
  - "acknowledg"
  - "\\bswag\\b"
  - "token of appreciation"
  - "listed (?:on|in) our"
  - "named in our"
  - "security hall of fame"
  - "publicly credit"
  - "we will thank"

# Discretionary / conditional
discretionary:
  - "at our (?:sole )?discretion"
  - "may offer a reward"
  - "discretion(?:ary)?"
  - "case[- ]by[- ]case"
  - "no guarantee of (?:a )?reward"
  - "submitting a report does not (?:create|guarantee)"
  - "rewards? (?:are|is) not guaranteed"