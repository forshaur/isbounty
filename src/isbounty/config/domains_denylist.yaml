# Hosts known to be news, blog, wiki, directory or aggregator sites.
# Entries match the exact host or a subdomain suffix (news.ycombinator.com
# still matches news.ycombinator.com). A specific program page on a platform
# domain is resolved by the platform resolver before this list is consulted.
news_and_blog_domains:
  - techcrunch.com
  - theverge.com
  - bleepingcomputer.com
  - arstechnica.com
  - wired.com
  - forbes.com
  - medium.com
  - reddit.com
  - news.ycombinator.com
  - krebsonsecurity.com
  - zdnet.com
  - thehackernews.com
  - securityweek.com
  - darkreading.com
  - infosecurity-magazine.com

wiki_domains:
  - wikipedia.org

directory_domains:
  - securitytxt.org
  - openbugbounty.org

